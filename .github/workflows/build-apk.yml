name: Build LiveChat Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android project
        working-directory: mobile
        run: flutter create --platforms=android --project-name livechat_messenger .

      - name: Enable cleartext WebSocket for testing
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          PY

      - name: Remove generated default test
        working-directory: mobile
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze V14 entrypoint
        working-directory: mobile
        run: flutter analyze lib/main.dart --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Prepare APK
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk LiveChat-V14-Premium.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveChat-V14-Premium-Android
          path: LiveChat-V14-Premium.apk
          if-no-files-found: error
          retention-days: 30
