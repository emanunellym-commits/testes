name: Build LiveChat Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify mobile project
        run: |
          test -f mobile/pubspec.yaml || (echo 'mobile/pubspec.yaml não encontrado' && exit 1)

      - name: Create Android platform files
        working-directory: mobile
        run: flutter create --platforms=android .

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=API_URL=${{ vars.LIVECHAT_API_URL || 'http://10.0.2.2:3000' }}

      - name: Rename APK
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk LiveChat-V12.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveChat-V12-Android
          path: LiveChat-V12.apk
          if-no-files-found: error
          retention-days: 30
