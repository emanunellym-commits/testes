name: Build LiveChat Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android project
        working-directory: mobile
        run: flutter create --platforms=android --project-name livechat_messenger .

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Prepare APK
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk LiveChat-V12-Demo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveChat-V12-Demo-Android
          path: LiveChat-V12-Demo.apk
          if-no-files-found: error
          retention-days: 30
